apiVersion: apps/v1
kind: Deployment
metadata:
  name: stripe-shop-pc-04-11-2026
  labels:
    app: stripe-shop
    nom: ponchin
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stripe-shop
  template:
    metadata:
      labels:
        app: stripe-shop
        nom: ponchin
    spec:
      containers:
        - name: stripe-shop-pc-04-11-2026
          image: nagarrath/stripe-shop-pc-04-11-2026:v1
          ports:
            - containerPort: 5000
          env:
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret-pc-04-11-2026
                  key: STRIPE_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stripe-shop-svc-pc-04-11-2026
  labels:
    app: stripe-shop
    nom: ponchin
spec:
  type: NodePort
  selector:
    app: stripe-shop
  ports:
    - port: 5000
      targetPort: 5000