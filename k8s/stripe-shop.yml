apiVersion: apps/v1
kind: Deployment
metadata:
  name: stripe-shop-pc-04-11-2026
  labels:
    app: stripe-shop
    nom: ponchin
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stripe-shop
  template:
    metadata:
      labels:
        app: stripe-shop
        nom: ponchin
    spec:
      containers:
        - name: stripe-shop-pc-04-11-2026
          image: nagarrath/stripe-shop-pc-04-11-2026:v1
          ports:
            - containerPort: 5000
          env:
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret-pc-04-11-2026
                  key: STRIPE_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stripe-shop-svc-pc-04-11-2026
  labels:
    app: stripe-shop
    nom: ponchin
spec:
  type: NodePort
  selector:
    app: stripe-shop
  ports:
    - port: 5000
      targetPort: 5000


---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stripe-shop-hpa-pc-04-11-2026
  labels:
    app: stripe-shop
    nom: ponchin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stripe-shop-pc-04-11-2026
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50