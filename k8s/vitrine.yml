apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitrine-pc-04-11-2026
  labels:
    app: vitrine
    nom: ponchin
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vitrine
  template:
    metadata:
      labels:
        app: vitrine
        nom: ponchin
    spec:
      containers:
        - name: vitrine-pc-04-11-2026
          image: nagarrath/vitrine-pc-04-11-2026:v1
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vitrine-svc-pc-04-11-2026
  labels:
    app: vitrine
    nom: ponchin
spec:
  type: NodePort
  selector:
    app: vitrine
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vitrine-hpa-pc-04-11-2026
  labels:
    app: vitrine
    nom: ponchin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vitrine-pc-04-11-2026
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50