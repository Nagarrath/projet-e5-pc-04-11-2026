apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-api-mc-04-11-2026
  labels:
    app: stock-api-mc-04-11-2026
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stock-api-mc-04-11-2026
  template:
    metadata:
      labels:
        app: stock-api-mc-04-11-2026
    spec:
      containers:
      - name: stock-api
        image: hizigoh/stock-api-mc-04-11-2026:v1
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: service-stock-api-mc-04-11-2026
spec:
  type: NodePort
  selector:
    app: stock-api-mc-04-11-2026
  ports:
    - port: 5000
      targetPort: 5000
