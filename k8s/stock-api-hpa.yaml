apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stock-api-hpa-mc-04-11-2026
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stock-api-mc-04-11-2026
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
